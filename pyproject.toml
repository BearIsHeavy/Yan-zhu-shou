[project]
name = "server"
version = "0.1.0"
description = "YanZhuShou - Educational Platform API with AI-powered wrong question analysis"
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Authentication & Security
    "bcrypt>=4.0.1,<4.1.0",
    "passlib>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.1.0",
    
    # Caching
    "redis>=5.0.0",
    
    # HTTP Client
    "httpx>=0.26.0",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # AI Analysis (new)
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    
    # Document Parsing (new)
    "pypdf>=3.0.0",
    "python-docx>=0.8.0",
]
