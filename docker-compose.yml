services:
  # FastAPI Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yanzhushou_api
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      # Database connection (uses internal Docker network)
      DATABASE_URL: postgresql+asyncpg://api:api@postgres:5432/fastapi_db
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount uploads directory for persistent file storage
      - uploads_data:/app/uploads
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database Setup
  postgres:
    image: postgres:16-alpine
    container_name: backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d fastapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

# Define persistent storage
volumes:
  postgres_data:
  uploads_data:

# Define network for inter-service communication
networks:
  backend_network:
    driver: bridge